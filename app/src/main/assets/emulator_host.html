<!DOCTYPE html>
<html lang="ar" dir="ltr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>RetroVerse Core Host</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
  html, body {
    width: 100%;
    height: 100%;
    background: #05060B;
    overflow: hidden;
    direction: ltr;
    display: block;
    font-family: system-ui, -apple-system, sans-serif;
  }
  #stage {
    position: relative;
    width: 100%;
    height: 100%;
    background: #05060B;
    display: block;
    overflow: hidden;
    direction: ltr;
  }
  #viewport {
    position: relative;
    width: 100%;
    height: 100%;
    display: block;
    margin: 0 auto;
    overflow: hidden;
    direction: ltr;
  }
  /* Explicit non-flex sizing so iframe width NEVER collapses to 0 */
  #game-screen {
    position: relative;
    flex: none;
    display: block;
    width: 100vw;
    height: 100%;
    margin: 0 auto;
    background: #05060B;
    overflow: hidden;
    direction: ltr;
  }
  @media (orientation: portrait) {
    #game-screen {
      width: 100vw;
      height: calc(100vw * 3 / 4);
      max-height: 100%;
      position: relative;
      flex: none;
      display: block;
    }
  }
  @media (orientation: landscape) {
    #game-screen {
      height: 100dvh;
      max-height: 100%;
      width: min(100vw, calc(100dvh * 4 / 3));
      margin: 0 auto;
      position: relative;
      flex: none;
      display: block;
    }
  }
  #ejs-frame {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
    display: block;
    background: #05060B;
  }
  #hbCanvas {
    width: 100%;
    height: 100%;
    object-fit: contain;
    image-rendering: pixelated;
    background: #07080D;
    display: none;
  }
  #scanlines-overlay {
    pointer-events: none;
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
      to bottom,
      rgba(0,0,0,0) 0px,
      rgba(0,0,0,0) 2px,
      rgba(0,0,0,0.34) 3px,
      rgba(0,0,0,0.34) 4px
    );
    opacity: 0;
    z-index: 20;
    transition: opacity 0.2s ease;
  }
  #crt-overlay {
    pointer-events: none;
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at center, transparent 58%, rgba(0,0,0,0.62) 100%);
    box-shadow: inset 0 0 36px rgba(139, 92, 246, 0.16);
    opacity: 0;
    z-index: 21;
    transition: opacity 0.2s ease;
  }
  .filter-crt #scanlines-overlay { opacity: 0.70; }
  .filter-crt #crt-overlay { opacity: 1; }
  .filter-scanlines #scanlines-overlay { opacity: 0.88; }
  .filter-lcd #scanlines-overlay {
    opacity: 0.44;
    background:
      repeating-linear-gradient(90deg, rgba(255,255,255,0.04) 0 1px, transparent 1px 3px),
      repeating-linear-gradient(0deg, rgba(0,0,0,0.22) 0 1px, transparent 1px 3px);
  }
  .filter-sharp #ejs-frame, .filter-sharp #hbCanvas { image-rendering: pixelated; }
  .filter-smooth #ejs-frame, .filter-smooth #hbCanvas { image-rendering: auto; }
  .scanlines-on #scanlines-overlay { opacity: 0.85; }

  .aspect-43 #game-screen { width: min(100vw, calc(100vh * 4 / 3)); height: min(100vh, calc(100vw * 3 / 4)); }
  .aspect-169 #game-screen { width: min(100vw, calc(100vh * 16 / 9)); height: min(100vh, calc(100vw * 9 / 16)); }
  .aspect-full #game-screen { width: 100vw; height: 100%; }
  .aspect-int #game-screen { width: 100vw; height: 100%; }
</style>
</head>
<body class="filter-sharp aspect-orig" dir="ltr">
  <div id="stage">
    <div id="viewport">
      <div id="game-screen"></div>
      <canvas id="hbCanvas" width="320" height="240"></canvas>
    </div>
    <div id="scanlines-overlay"></div>
    <div id="crt-overlay"></div>
  </div>

<script>
(function() {
  const CDN_PRIMARY = 'https://cdn.emulatorjs.org/stable/data/';
  const CDN_FALLBACK = 'https://cdn.jsdelivr.net/gh/EmulatorJS/EmulatorJS@main/data/';
  const LOCAL_DATA = './ejs/data/';
  const EJS_CACHE = 'ejs-v1';

  let mode = 'idle'; // 'emulatorjs' | 'homebrew'
  let activeFrame = null;
  let prepFrame = null;
  let prepBlobUrl = null;
  let activeBlobUrl = null;
  let activeBiosBlobUrl = null;
  let watchdogTimer = null;
  let countdownTimer = null;
  let fpsTimer = null;
  let resizeObserver = null;
  let wakeLockSentinel = null;
  let lastConfig = null;
  let logs = [];
  let audioVol = 0.75;
  let audioMuted = false;
  let speedMultiplier = 1;
  let paused = false;
  let frameStarted = false;
  let renderScalePercent = 100;
  let autoRetriedFallback = false;
  let activeBootId = 0;
  let currentCdnUsed = CDN_PRIMARY;
  let stageMap = { 1: 'pending', 2: 'pending', 3: 'pending', 4: 'pending', 5: 'pending', 6: 'pending' };

  // Gamepad configuration & state
  let gamepadDeadzone = 0.15;
  let gamepadHaptics = true;
  let webGamepadCount = 0;
  let webGamepadNames = [];
  const gpPrevBtn = {};
  const gpPrevAxis = {};
  let gpShortcutCooldown = 0;

  const hbKeys = {
    up: false, down: false, left: false, right: false,
    a: false, b: false, x: false, y: false,
    l1: false, r1: false, start: false, select: false
  };

  // Register coi-serviceworker & persistent storage seamlessly
  (function initServiceWorkerAndStorage() {
    if ('storage' in navigator && typeof navigator.storage.persist === 'function') {
      navigator.storage.persist().catch(() => {});
    }
    if ('serviceWorker' in navigator && window.isSecureContext) {
      navigator.serviceWorker.register('coi-serviceworker.js').catch(() => {});
    }
  })();

  function addLog(level, message) {
    const line = '[' + new Date().toISOString().substr(11, 8) + '][' + level + '] ' + String(message);
    logs.push(line);
    if (logs.length > 300) logs.shift();
    try {
      if (window.RetroHost && window.RetroHost.onDiagnosticLog) {
        window.RetroHost.onDiagnosticLog(level, line);
      }
    } catch (_) {}
  }

  function setStage(stageNum, status, detail) {
    stageMap[stageNum] = status;
    try {
      if (window.RetroHost && window.RetroHost.onStageUpdate) {
        window.RetroHost.onStageUpdate(stageNum, status, detail || '');
      }
    } catch (_) {}
  }

  function resetStages() {
    for (let i = 1; i <= 6; i++) setStage(i, 'pending', '');
  }

  function notifyStatus(status, detail) {
    try {
      if (window.RetroHost && window.RetroHost.onEngineStatus) {
        window.RetroHost.onEngineStatus(status, detail || '');
      }
    } catch (_) {}
  }

  function notifyLoadingTick(elapsedSec, totalSec) {
    try {
      if (window.RetroHost && window.RetroHost.onLoadingTick) {
        window.RetroHost.onLoadingTick(elapsedSec, totalSec);
      }
    } catch (_) {}
  }

  function firstUnpassedStage() {
    for (let i = 1; i <= 6; i++) {
      if (stageMap[i] === 'fail') return i;
    }
    for (let i = 1; i <= 5; i++) {
      if (stageMap[i] !== 'pass') return i;
    }
    return 5;
  }

  function isOptionalAssetUrl(url) {
    const u = String(url || '').toLowerCase();
    return u.includes('cores/reports/') ||
      u.includes('version.json') ||
      u.includes('/localization/') ||
      u.endsWith('.map') ||
      u.includes('favicon.ico') ||
      u.includes('manifest.json');
  }

  function isCriticalAssetUrl(url) {
    const u = String(url || '').toLowerCase();
    return u.includes('loader.js') ||
      u.includes('emulator.min.js') ||
      u.includes('emulator.js') ||
      (u.includes('/cores/') && !u.includes('/reports/'));
  }

  function checkWebGL2() {
    try {
      const c = document.createElement('canvas');
      return !!(c.getContext('webgl2') || c.getContext('webgl'));
    } catch (_) {
      return false;
    }
  }

  async function acquireWebWakeLock() {
    try {
      if ('wakeLock' in navigator && !wakeLockSentinel) {
        wakeLockSentinel = await navigator.wakeLock.request('screen');
        wakeLockSentinel.addEventListener('release', () => { wakeLockSentinel = null; });
      }
    } catch (_) {}
  }

  function releaseWebWakeLock() {
    try {
      if (wakeLockSentinel) {
        wakeLockSentinel.release().catch(() => {});
        wakeLockSentinel = null;
      }
    } catch (_) {}
  }

  // AudioContext resume helper on first user gesture
  const trackedAudioContexts = [];
  if (typeof window.AudioContext !== 'undefined' || typeof window.webkitAudioContext !== 'undefined') {
    const OrigAC = window.AudioContext || window.webkitAudioContext;
    if (OrigAC && !OrigAC.__rvWrapped) {
      const WrappedAC = function() {
        const ctx = new OrigAC(...arguments);
        trackedAudioContexts.push(ctx);
        return ctx;
      };
      WrappedAC.prototype = OrigAC.prototype;
      WrappedAC.__rvWrapped = true;
      window.AudioContext = WrappedAC;
      if (window.webkitAudioContext) window.webkitAudioContext = WrappedAC;
    }
  }

  function resumeAllAudio() {
    trackedAudioContexts.forEach((ctx) => {
      try { if (ctx && ctx.state === 'suspended') ctx.resume().catch(() => {}); } catch (_) {}
    });
    if (activeFrame && activeFrame.contentWindow) {
      try { activeFrame.contentWindow.postMessage({ __rv_cmd: true, cmd: 'resume_audio' }, '*'); } catch (_) {}
    }
  }
  window.addEventListener('pointerdown', resumeAllAudio, { passive: true });
  window.addEventListener('keydown', resumeAllAudio, { passive: true });

  // Pause safely on background visibilitychange & re-acquire wake lock on resume
  document.addEventListener('visibilitychange', () => {
    if (mode !== 'emulatorjs' || !frameStarted) return;
    if (document.hidden) {
      sendToFrame({ cmd: 'pause', paused: true });
      releaseWebWakeLock();
    } else {
      if (!paused) sendToFrame({ cmd: 'pause', paused: false });
      acquireWebWakeLock();
    }
  });

  function clearTimers() {
    if (watchdogTimer) { clearTimeout(watchdogTimer); watchdogTimer = null; }
    if (countdownTimer) { clearInterval(countdownTimer); countdownTimer = null; }
    if (fpsTimer) { clearInterval(fpsTimer); fpsTimer = null; }
  }

  function destroyActiveFrame(revokeBlobs) {
    clearTimers();
    releaseWebWakeLock();
    if (resizeObserver) {
      try { resizeObserver.disconnect(); } catch (_) {}
      resizeObserver = null;
    }
    if (activeFrame) {
      try { activeFrame.srcdoc = ''; } catch (_) {}
      try { activeFrame.remove(); } catch (_) {}
      activeFrame = null;
    }
    const screen = document.getElementById('game-screen');
    if (screen) {
      screen.innerHTML = '';
      screen.style.width = '';
      screen.style.height = '';
    }
    if (revokeBlobs !== false) {
      if (activeBlobUrl) {
        try { URL.revokeObjectURL(activeBlobUrl); } catch (_) {}
        activeBlobUrl = null;
      }
      if (activeBiosBlobUrl) {
        try { URL.revokeObjectURL(activeBiosBlobUrl); } catch (_) {}
        activeBiosBlobUrl = null;
      }
    }
    frameStarted = false;
  }

  function measureBox(el) {
    if (!el) return { w: 0, h: 0 };
    const r = el.getBoundingClientRect();
    return { w: Math.round(r.width), h: Math.round(r.height) };
  }

  function waitForNonZeroGameScreen(bootId) {
    return new Promise((resolve) => {
      const screen = document.getElementById('game-screen');
      const startedWait = performance.now();

      function step() {
        if (bootId !== activeBootId) {
          resolve({ w: 0, h: 0 });
          return;
        }
        const m = measureBox(screen);
        if (m.w > 100 && m.h > 100) {
          resolve(m);
          return;
        }
        if (performance.now() - startedWait < 3000) {
          requestAnimationFrame(step);
        } else {
          const winW = Math.max(window.innerWidth || document.documentElement.clientWidth || 360, 320);
          const winH = Math.max(window.innerHeight || document.documentElement.clientHeight || 270, 240);
          const targetW = winW;
          const targetH = Math.min(winH, Math.max(240, Math.round(winW * 3 / 4)));
          screen.style.width = targetW + 'px';
          screen.style.height = targetH + 'px';
          screen.style.display = 'block';
          screen.style.flex = 'none';
          addLog('WARN', 'Applied fallback pixel dimensions to #game-screen: ' + targetW + 'x' + targetH);
          requestAnimationFrame(() => resolve(measureBox(screen)));
        }
      }
      requestAnimationFrame(step);
    });
  }

  // Embedded free GBA Homebrew ROM (ARM7TDMI Mode 3 animated framebuffer wave, boots without BIOS)
  function createTestGbaRomBytes() {
    const rom = new Uint8Array(4096);
    const w32 = (off, val) => {
      rom[off] = val & 0xFF;
      rom[off + 1] = (val >>> 8) & 0xFF;
      rom[off + 2] = (val >>> 16) & 0xFF;
      rom[off + 3] = (val >>> 24) & 0xFF;
    };
    w32(0x00, 0xEA00002E);
    const title = 'RETROVERSE  ';
    for (let i = 0; i < 12; i++) rom[0xA0 + i] = title.charCodeAt(i);
    rom[0xAC] = 0x41; rom[0xAD] = 0x52; rom[0xAE] = 0x56; rom[0xAF] = 0x45;
    rom[0xB0] = 0x30; rom[0xB1] = 0x31;
    rom[0xB2] = 0x96;
    let chk = 0;
    for (let i = 0xA0; i <= 0xBC; i++) chk = (chk - rom[i]) & 0xFF;
    rom[0xBD] = (chk - 0x19) & 0xFF;
    const prog = [
      0xE3A00301, 0xE3A01C04, 0xE3811003, 0xE1C010B0,
      0xE3A02406, 0xE3A04C96, 0xE3A05000,
      0xE1D010B6, 0xE35100A0, 0x1AFFFFFC,
      0xE3A03000, 0xE1A07005,
      0xE18270B3, 0xE2877001, 0xE2833002, 0xE1530084, 0x1AFFFFFA,
      0xE2855020, 0xEAFFFFF3
    ];
    for (let i = 0; i < prog.length; i++) w32(0xC0 + i * 4, prog[i]);
    return rom;
  }

  function createTinyDummyRomBytes(core) {
    if (core === 'gba' || core === 'mgba' || core === 'vba_next') return createTestGbaRomBytes();
    const bytes = new Uint8Array(1024);
    if (core === 'nes' || core === 'fceumm' || core === 'nestopia') {
      bytes[0] = 0x4E; bytes[1] = 0x45; bytes[2] = 0x53; bytes[3] = 0x1A; bytes[4] = 1; bytes[5] = 1;
    } else if (core === 'n64' || core === 'mupen64plus_next' || core === 'parallel_n64') {
      bytes[0] = 0x80; bytes[1] = 0x37; bytes[2] = 0x12; bytes[3] = 0x40;
    }
    return bytes;
  }

  async function resolveCdnBaseAsync(config) {
    if (config.cdnOverride && config.cdnOverride.length > 0) {
      return config.cdnOverride.endsWith('/') ? config.cdnOverride : config.cdnOverride + '/';
    }
    if (config.cdnMode === 'custom' && config.customDataPath) {
      const p = config.customDataPath.trim();
      return p.endsWith('/') ? p : p + '/';
    }
    // Layer 3: Check local bundled ./ejs/data/loader.js via HEAD first!
    try {
      const headRes = await fetch(LOCAL_DATA + 'loader.js', { method: 'HEAD', cache: 'no-store' });
      if (headRes && headRes.ok) {
        addLog('INFO', 'Using local embedded engine bundle: ' + LOCAL_DATA);
        return new URL(LOCAL_DATA, window.location.href).href;
      }
    } catch (_) {}

    if (config.cdnMode === 'jsdelivr') {
      return CDN_FALLBACK;
    }
    return CDN_PRIMARY;
  }

  function buildIframeSrcdoc(params) {
    const cfgJson = JSON.stringify({
      bootId: params.bootId,
      isPrepMode: !!params.isPrepMode,
      core: params.core,
      romUrl: params.romUrl,
      gameName: params.gameName,
      pathtodata: params.pathtodata,
      biosUrl: params.biosUrl || '',
      threads: !!params.threads,
      cheats: params.cheats || [],
      defaultOptions: params.defaultOptions || {},
      volume: params.volume,
      muted: params.muted
    });

    return '<!DOCTYPE html><html dir="ltr"><head><meta charset="UTF-8">' +
      '<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">' +
      '<style>' +
      '*{box-sizing:border-box;margin:0;padding:0;}' +
      'html,body{width:100%;height:100%;background:#05060B;overflow:hidden;display:block;direction:ltr;}' +
      '#game{width:100%;height:100%;display:block;position:relative;overflow:hidden;}' +
      '#game canvas,.ejs_canvas{width:100% !important;height:100% !important;object-fit:contain !important;display:block !important;}' +
      '.ejs_virtualGamepad_parent,.ejs_menu_bar,.ejs_context_menu{display:none !important;opacity:0 !important;pointer-events:none !important;}' +
      '</style></head><body dir="ltr"><div id="game"></div>' +
      '<script>' +
      'var CFG=' + cfgJson + ';' +
      'var EJS_CACHE_NAME="ejs-v1";' +
      'function postParent(type,payload){try{window.parent.postMessage({__rv:true,bootId:CFG.bootId,type:type,payload:payload},"*");}catch(_){}}' +

      // AudioContext resume on first touch/key inside iframe too
      'var __rvACs=[];(function(){var AC=window.AudioContext||window.webkitAudioContext;if(AC&&!AC.__rv){var W=function(){var c=new AC(...arguments);__rvACs.push(c);return c;};W.prototype=AC.prototype;W.__rv=true;window.AudioContext=W;if(window.webkitAudioContext)window.webkitAudioContext=W;}})();' +
      'function __rvResumeAudio(){__rvACs.forEach(function(c){try{if(c&&c.state==="suspended")c.resume();}catch(_){}});}' +
      'window.addEventListener("pointerdown",__rvResumeAudio,{passive:true});' +

      // [6] Runtime errors
      'window.onerror=function(msg,src,line){postParent("stage_6_err","window.onerror: "+msg+" @"+(src||"")+":"+line);};' +
      'window.addEventListener("unhandledrejection",function(e){var r=e&&e.reason;postParent("stage_6_err","unhandledrejection: "+(r&&r.message?r.message:String(r)));});' +
      'var origErr=console.error;console.error=function(){try{postParent("stage_6_err","console.error: "+Array.prototype.slice.call(arguments).join(" "));}catch(_){}return origErr.apply(console,arguments);};' +

      // Helper for Cache Storage fallback layer (Layer B)
      'function isCdnUrl(u){return u&&(u.indexOf("https://cdn.emulatorjs.org/")===0||u.indexOf("https://cdn.jsdelivr.net/")===0);}' +
      'function cacheOpen(){try{return ("caches" in window)?window.caches.open(EJS_CACHE_NAME):Promise.resolve(null);}catch(_){return Promise.resolve(null);}}' +
      'function guessMime(u){var l=String(u||"").toLowerCase();if(l.indexOf(".js")>-1)return"application/javascript";if(l.indexOf(".css")>-1)return"text/css";if(l.indexOf(".wasm")>-1)return"application/wasm";if(l.indexOf(".json")>-1)return"application/json";return"application/octet-stream";}' +

      // [4] Layer B Fallback Interceptor: wrap fetch, XHR, and <script>/<link> DOM insertions via Cache Storage (ejs-v1)
      '(function(){' +
      '  var origFetch=window.fetch;' +
      '  if(origFetch){' +
      '    window.fetch=function(input,init){' +
      '      var url=(typeof input==="string")?input:(input&&input.url?input.url:String(input));' +
      '      var isLocal=url.indexOf("blob:")===0||url.indexOf("data:")===0;' +
      '      if(isLocal||!isCdnUrl(url)){' +
      '        return origFetch.apply(this,arguments).then(function(res){' +
      '          if(!isLocal)postParent("net_log",{ok:res.ok,url:url,status:res.status,via:"fetch",bytes:Number(res.headers.get("Content-Length")||0)});' +
      '          return res;' +
      '        }).catch(function(err){' +
      '          if(!isLocal)postParent("net_log",{ok:false,url:url,status:0,error:(err&&err.message?err.message:String(err)),via:"fetch"});' +
      '          throw err;' +
      '        });' +
      '      }' +
      '      return cacheOpen().then(function(cache){' +
      '        if(!cache)return origFetch.apply(window,[url,{mode:"cors",credentials:"omit"}]);' +
      '        return cache.match(url,{ignoreVary:true}).then(function(hit){' +
      '          if(hit){' +
      '            postParent("net_log",{ok:true,url:url,status:200,via:"cache",bytes:Number(hit.headers.get("Content-Length")||0)});' +
      '            return hit.clone();' +
      '          }' +
      '          return origFetch.call(window,url,{mode:"cors",credentials:"omit"}).then(function(res){' +
      '            postParent("net_log",{ok:res.ok,url:url,status:res.status,via:"fetch",bytes:Number(res.headers.get("Content-Length")||0)});' +
      '            if(res&&res.ok&&res.type!=="opaque"){try{cache.put(url,res.clone());}catch(_){}}' +
      '            return res;' +
      '          }).catch(function(err){' +
      '            postParent("net_log",{ok:false,url:url,status:0,error:(err&&err.message?err.message:String(err)),via:"fetch"});' +
      '            throw err;' +
      '          });' +
      '        });' +
      '      });' +
      '    };' +
      '  }' +

      '  var origOpen=XMLHttpRequest.prototype.open;' +
      '  var origSend=XMLHttpRequest.prototype.send;' +
      '  XMLHttpRequest.prototype.open=function(method,url){this.__rvMethod=String(method||"GET").toUpperCase();this.__rvUrl=String(url||"");return origOpen.apply(this,arguments);};' +
      '  XMLHttpRequest.prototype.send=function(){' +
      '    var xhr=this,u=xhr.__rvUrl||"";' +
      '    var isLocal=u.indexOf("blob:")===0||u.indexOf("data:")===0;' +
      '    if(!isLocal&&u){' +
      '      xhr.addEventListener("loadend",function(){' +
      '        var ok=xhr.status>=200&&xhr.status<400;' +
      '        var size=0;try{if(xhr.response instanceof ArrayBuffer)size=xhr.response.byteLength;else if(typeof xhr.responseText==="string")size=xhr.responseText.length;}catch(_){}' +
      '        postParent("net_log",{ok:ok,url:u,status:xhr.status,via:"XHR",bytes:size});' +
      '        if(ok&&isCdnUrl(u)&&xhr.__rvMethod==="GET"){' +
      '          cacheOpen().then(function(cache){' +
      '            if(!cache)return;' +
      '            try{' +
      '              var body=null;' +
      '              if(xhr.response instanceof ArrayBuffer)body=xhr.response;' +
      '              else if(typeof xhr.responseText==="string")body=xhr.responseText;' +
      '              if(body!==null)cache.put(u,new Response(body,{status:200,headers:{"Content-Type":guessMime(u)}}));' +
      '            }catch(_){}' +
      '          });' +
      '        }' +
      '      });' +
      '      xhr.addEventListener("error",function(){' +
      '        postParent("net_log",{ok:false,url:u,status:xhr.status||0,error:"XHR network error",via:"XHR"});' +
      '      });' +
      '    }' +
      '    return origSend.apply(this,arguments);' +
      '  };' +

      // Intercept dynamic <script src> & <link href> added to DOM to serve from Cache Storage blob URLs if available
      '  var origAppend=Node.prototype.appendChild;' +
      '  var origInsert=Node.prototype.insertBefore;' +
      '  function interceptDomTag(node){' +
      '    try{' +

      '    }catch(_){return false;}' +

  function tryFallbackCdnOrFail(failedStageNum, failReason) {
    if (frameStarted) return;
    const isOnlineNow = navigator.onLine !== false;
    if (isOnlineNow && !autoRetriedFallback && currentCdnUsed !== CDN_FALLBACK && lastConfig) {
      autoRetriedFallback = true;
      addLog('WARN', '[AUTO-FALLBACK] Stage [' + failedStageNum + '] failed (' + failReason + '). Retrying once with ' + CDN_FALLBACK);
      const retryCfg = Object.assign({}, lastConfig, { cdnOverride: CDN_FALLBACK, __isFallbackRetry: true });
      window.RetroEngine.bootRom(retryCfg);
      return;
    }
    clearTimers();
    const coreLow = ((lastConfig && lastConfig.core) || '').toLowerCase();
    const isolated = !!window.crossOriginIsolated && typeof SharedArrayBuffer !== 'undefined';
    let finalDetail = 'STAGE_' + failedStageNum + '|' + failReason;
    if (coreLow === 'psp' || coreLow === 'ppsspp') {
      if (!isolated) finalDetail = 'PSP_NO_SAB|نواة PSP تتطلب crossOriginIsolated وSharedArrayBuffer';
      else if (!isOnlineNow) finalDetail = 'OFFLINE_NOT_PREPARED|نواة PSP غير مجهزة للعمل أوفلاين — جهّزها بالإنترنت من الإعدادات';
    } else if (!isOnlineNow) {
      finalDetail = 'OFFLINE_NOT_PREPARED|هذا النظام يحتاج تجهيزاً مرة واحدة بالإنترنت من الحزمة الأوفلاين';
    }
    notifyStatus('error', finalDetail);
  }

  // Track hidden offline bundle pre-warming state
  let activePrepSession = null;

  function finishPrepSession(ok, errMsg) {
    const sess = activePrepSession;
    if (!sess) return;
    activePrepSession = null;
    if (sess.timer) clearTimeout(sess.timer);
    if (sess.idleTimer) clearTimeout(sess.idleTimer);
    if (prepFrame) {
      try { prepFrame.srcdoc = ''; } catch (_) {}
      try { prepFrame.remove(); } catch (_) {}
      prepFrame = null;
    }
    if (prepBlobUrl) {
      try { URL.revokeObjectURL(prepBlobUrl); } catch (_) {}
      prepBlobUrl = null;
    }
    try {
      if (window.RetroHost && window.RetroHost.onOfflinePrepareProgress) {
        window.RetroHost.onOfflinePrepareProgress(
          sess.systemId,
          sess.core,
          sess.threads,
          ok ? 100 : 0,
          sess.totalBytes,
          sess.urls.length,
          JSON.stringify(sess.urls),
          true,
          ok ? '' : (errMsg || 'Download timeout or network error')
        );
      }
    } catch (_) {}
  }

  window.addEventListener('message', function(ev) {
    const d = ev.data;
    if (!d || !d.__rv) return;

    // Route hidden offline-prep iframe messages cleanly
    if (activePrepSession && d.bootId === activePrepSession.bootId) {
      const s = activePrepSession;
      if (d.type === 'net_log') {
        const n = d.payload || {};
        if (n.ok && n.url && n.url.indexOf('blob:') !== 0) {
          if (s.urls.indexOf(n.url) === -1) {
            s.urls.push(n.url);
            s.totalBytes += (n.bytes || 0);
          }
          const uLow = n.url.toLowerCase();
          if (uLow.includes('loader.js')) s.hasLoader = true;
          if (uLow.includes('emulator.min.js') || uLow.includes('emulator.js')) s.hasEmuJs = true;
          if (uLow.includes('/cores/') && !uLow.includes('/reports/')) s.hasCoreData = true;
          const pct = Math.min(
            95,
            (s.hasLoader ? 20 : 5) + (s.hasEmuJs ? 25 : 0) + (s.hasCoreData ? 40 : 0) + Math.min(10, s.urls.length * 2)
          );
          try {
            if (window.RetroHost && window.RetroHost.onOfflinePrepareProgress) {
              window.RetroHost.onOfflinePrepareProgress(
                s.systemId, s.core, s.threads, pct, s.totalBytes, s.urls.length, '[]', false, ''
              );
            }
          } catch (_) {}
          if (s.hasCoreData && s.hasEmuJs) {
            if (s.idleTimer) clearTimeout(s.idleTimer);
            s.idleTimer = setTimeout(() => finishPrepSession(true, ''), 1800);
          }
        } else if (!n.ok && isCriticalAssetUrl(n.url)) {
          finishPrepSession(false, 'HTTP ' + (n.status || n.error) + ': ' + n.url);
        }
      } else if (d.type === 'stage_2' && d.payload && !d.payload.ok) {
        finishPrepSession(false, 'Failed loader.js');
      } else if (d.type === 'stage_5_ready' || d.type === 'stage_5_start' || d.type === 'stage_3') {
        if (s.hasCoreData || (d.type === 'stage_5_start')) {
          if (s.idleTimer) clearTimeout(s.idleTimer);
          s.idleTimer = setTimeout(() => finishPrepSession(true, ''), 600);
        }
      }
      // Note: any ROM-execution errors AFTER core downloaded are explicitly expected and ignored in prep mode!
      return;
    }

    if (d.bootId && d.bootId !== activeBootId) return;

    if (d.type === 'stage_2') {
      const p = d.payload || {};
      if (p.ok) {
        addLog('INFO', '[2] تحميل loader.js: نجح (' + p.url + ')');
        setStage(2, 'pass', 'OK');
      } else {
        addLog('ERR', '[2] تحميل loader.js: فشل (' + p.url + ')');
        setStage(2, 'fail', 'FAILED');
        tryFallbackCdnOrFail(2, 'تعذر تحميل loader.js من ' + p.url);
      }
    } else if (d.type === 'stage_3') {
      const ok = !!(d.payload && d.payload.ok);
      const cBox = measureBox(document.getElementById('game-screen'));
      const fBox = measureBox(activeFrame);
      const sizeStr = cBox.w + '×' + cBox.h + ' / iframe:' + fBox.w + '×' + fBox.h;
      if (ok || frameStarted) {
        addLog('INFO', '[3] وجود window.EJS_emulator: نعم (' + (d.payload.ms || 0) + 'ms) · المقاس ' + sizeStr);
        setStage(3, 'pass', fBox.w + '×' + fBox.h);
      } else {
        addLog('ERR', '[3] غياب window.EJS_emulator بعد 15 ثانية · المقاس ' + sizeStr);
        setStage(3, 'fail', 'غائب 15ث');
        tryFallbackCdnOrFail(3, 'غياب window.EJS_emulator بعد 15 ثانية');
      }
    } else if (d.type === 'net_log') {
      const n = d.payload || {};
      if (!n.ok && isOptionalAssetUrl(n.url)) {
        addLog('WARN', '[4] (ملف اختياري) ' + n.url + ' -> HTTP ' + (n.status || n.error));
        return;
      }
      const msg = '[4] ' + (n.via || 'net') + ' ' + n.url + ' -> ' + (n.ok ? ('HTTP ' + n.status) : (n.error || ('HTTP ' + n.status)));
      addLog(n.ok ? 'INFO' : (isCriticalAssetUrl(n.url) ? 'ERR' : 'WARN'), msg);

      if (n.ok) {
        if (stageMap[4] !== 'fail') setStage(4, 'pass', n.via === 'cache' || n.via === 'dom-cache' ? 'CACHE' : ('HTTP ' + n.status));
      } else if (isCriticalAssetUrl(n.url)) {
        setStage(4, 'fail', (n.status ? 'HTTP ' + n.status : n.error));
        if (n.url.toLowerCase().includes('/cores/')) {
          tryFallbackCdnOrFail(4, 'فشل تحميل ملف النواة (' + n.url + ')');
        } else if (n.url.toLowerCase().includes('emulator')) {
          tryFallbackCdnOrFail(4, 'فشل تحميل emulator.min.js (' + n.url + ')');
        }
      }
    } else if (d.type === 'stage_5_ready') {
      addLog('INFO', '[5] EJS_ready تم استدعاؤه للنواة: ' + d.payload);
    } else if (d.type === 'stage_5_start') {
      frameStarted = true;
      clearTimers();
      acquireWebWakeLock();
      const cBox = measureBox(document.getElementById('game-screen'));
      const fBox = measureBox(activeFrame);
      if (cBox.w > 100 && cBox.h > 100 && fBox.w > 100 && fBox.h > 100) {
        setStage(1, 'pass', fBox.w + '×' + fBox.h);
      }
      if (stageMap[3] !== 'pass') setStage(3, 'pass', fBox.w + '×' + fBox.h);
      if (stageMap[4] !== 'fail') setStage(4, 'pass', 'OK');
      setStage(5, 'pass', 'EJS_onGameStart');
      if (stageMap[6] !== 'fail') setStage(6, 'pass', 'OK');
      addLog('INFO', '[5] EJS_onGameStart تم التشغيل! الحاوية=' + cBox.w + '×' + cBox.h + ' iframe=' + fBox.w + '×' + fBox.h);
      notifyStatus('running', (lastConfig && lastConfig.core) || '');
      try {
        window.focus();
        if (activeFrame) activeFrame.focus();
      } catch (_) {}
      sendToFrame({ cmd: 'focus' });
      fpsTimer = setInterval(() => {
        const fps = paused ? 0 : 60;
        if (window.RetroHost && window.RetroHost.onFpsUpdate) {
          window.RetroHost.onFpsUpdate(fps, 16.6);
        }
      }, 1000);
    } else if (d.type === 'canvas_size') {
      addLog('INFO', '[5] أبعاد Canvas داخل اللعبة: ' + d.payload.w + '×' + d.payload.h);
    } else if (d.type === 'stage_6_err') {
      addLog('ERR', '[6] ' + d.payload);
      if (!frameStarted) setStage(6, 'fail', String(d.payload).slice(0, 100));
    } else if (d.type === 'state_exported') {
      pendingCallbacks[d.payload.reqId] && pendingCallbacks[d.payload.reqId](d.payload.data);
      delete pendingCallbacks[d.payload.reqId];
    } else if (d.type === 'screenshot_taken') {
      pendingCallbacks[d.payload.reqId] && pendingCallbacks[d.payload.reqId](d.payload.dataUrl);
      delete pendingCallbacks[d.payload.reqId];
    }
  });

  const pendingCallbacks = {};
  let reqSeq = 1;

  function sendToFrame(cmdObj) {
    if (activeFrame && activeFrame.contentWindow) {
      activeFrame.contentWindow.postMessage(Object.assign({ __rv_cmd: true }, cmdObj), '*');
    }
  }

  // ===== Full Web Gamepad API Loop (up to 4 players, standard + hat axes[9] fallback, deadzone, rumble, shortcuts) =====
  function syncWebGamepadsState() {
    if (!navigator.getGamepads) return;
    const raw = Array.from(navigator.getGamepads()).filter(Boolean);
    webGamepadCount = raw.length;
    webGamepadNames = raw.map((g) => g.id || 'Gamepad');
    try {
      if (window.RetroHost && window.RetroHost.onWebGamepadsChanged) {
        window.RetroHost.onWebGamepadsChanged(webGamepadCount, JSON.stringify(webGamepadNames));
      }
    } catch (_) {}
  }
  window.addEventListener('gamepadconnected', syncWebGamepadsState);
  window.addEventListener('gamepaddisconnected', syncWebGamepadsState);

  const STD_BTN_MAP = {
    0: 0, 1: 8, 2: 1, 3: 9,
    4: 10, 5: 11, 6: 12, 7: 13,
    8: 2, 9: 3, 10: 14, 11: 15,
    12: 4, 13: 5, 14: 6, 15: 7
  };

  function emitPadInput(player, idx, val) {
    if (mode === 'emulatorjs') {
      sendToFrame({ cmd: 'input', player: player, index: idx, value: val });
    } else if (mode === 'homebrew' && player === 0) {
      window.RetroInput.simulate(idx, val);
    }
  }

  function triggerRumble(gp, strength) {
    if (!gamepadHaptics || !gp || !gp.vibrationActuator) return;
    try {
      if (typeof gp.vibrationActuator.playEffect === 'function') {
        gp.vibrationActuator.playEffect('dual-rumble', {
          startDelay: 0,
          duration: 38,
          weakMagnitude: strength || 0.25,
          strongMagnitude: strength || 0.35
        }).catch(() => {});
      }
    } catch (_) {}
  }

  (function gamepadPollLoop() {
    if (navigator.getGamepads && mode !== 'idle') {
      const pads = navigator.getGamepads();
      let activeCount = 0;
      for (let p = 0; p < Math.min(4, pads.length); p++) {
        const gp = pads[p];
        if (!gp) continue;
        activeCount++;

        // Shortcut: Select (8) + Start (9) toggles menu drawer
        const selPressed = !!(gp.buttons[8] && gp.buttons[8].pressed);
        const stPressed = !!(gp.buttons[9] && gp.buttons[9].pressed);
        const now = performance.now();
        if (selPressed && stPressed && now > gpShortcutCooldown) {
          gpShortcutCooldown = now + 700;
          try { window.RetroHost && window.RetroHost.onGamepadShortcut && window.RetroHost.onGamepadShortcut('menu'); } catch (_) {}
        }

        // Standard & custom buttons
        for (let b = 0; b < gp.buttons.length; b++) {
          const ejsIdx = STD_BTN_MAP[b];
          if (ejsIdx === undefined) continue;
          const btn = gp.buttons[b];
          const val = (typeof btn.value === 'number' && (b === 6 || b === 7)) ? (btn.value > 0.15 ? btn.value : 0) : (btn.pressed ? 1 : 0);
          const k = p + '_' + b;
          if (gpPrevBtn[k] !== val) {
            gpPrevBtn[k] = val;
            emitPadInput(p, ejsIdx, val);
            if (val > 0 && (b === 0 || b === 1 || b === 2 || b === 3)) {
              triggerRumble(gp, 0.2);
            }
          }
        }

        // Fallback Hat Switch on axes[9] for non-standard Bluetooth gamepads
        if (gp.axes && gp.axes.length > 9 && (!gp.buttons[12] || gp.mapping !== 'standard')) {
          const hat = gp.axes[9];
          const up = (hat >= -1.05 && hat <= -0.75) || (hat >= 0.75 && hat <= 1.05) ? 1 : 0;
          const right = (hat >= -0.75 && hat <= -0.15) ? 1 : 0;
          const down = (hat >= -0.15 && hat <= 0.35) ? 1 : 0;
          const left = (hat >= 0.35 && hat <= 0.78) ? 1 : 0;
          const hatVals = [[4, up], [5, down], [6, left], [7, right]];
          hatVals.forEach(([idx, v]) => {
            const k = p + '_hat_' + idx;
            if (gpPrevBtn[k] !== v) {
              gpPrevBtn[k] = v;
              emitPadInput(p, idx, v);
            }
          });
        }

        // Dual Analog Sticks with configurable Deadzone
        const dz = gamepadDeadzone;
        [[0, 16], [2, 20]].forEach(([axBase, ejsBase]) => {
          const rawX = (gp.axes && gp.axes[axBase]) || 0;
          const rawY = (gp.axes && gp.axes[axBase + 1]) || 0;
          const px = rawX > dz ? Math.round(rawX * 32767) : 0;
          const nx = rawX < -dz ? Math.round(-rawX * 32767) : 0;
          const py = rawY > dz ? Math.round(rawY * 32767) : 0;
          const ny = rawY < -dz ? Math.round(-rawY * 32767) : 0;
          const vals = [[ejsBase, px], [ejsBase + 1, nx], [ejsBase + 2, py], [ejsBase + 3, ny]];
          vals.forEach(([idx, v]) => {
            const k = p + '_ax_' + idx;
            if (gpPrevAxis[k] !== v) {
              gpPrevAxis[k] = v;
              emitPadInput(p, idx, v);
            }
          });
        });
      }
      if (activeCount !== webGamepadCount) syncWebGamepadsState();
    }
    requestAnimationFrame(gamepadPollLoop);
  })();

  // Keyboard HID default controls (Arrows + Z X A S Q E Enter Shift) + preventDefault
  const HID_KEY_MAP = {
    ArrowUp: 4, ArrowDown: 5, ArrowLeft: 6, ArrowRight: 7,
    z: 0, Z: 0, x: 8, X: 8, a: 1, A: 1, s: 9, S: 9,
    q: 10, Q: 10, e: 11, E: 11, Enter: 3, Shift: 2
  };
  window.addEventListener('keydown', (e) => {
    const idx = HID_KEY_MAP[e.key];
    if (idx !== undefined && mode !== 'idle') {
      e.preventDefault();
      window.RetroInput.simulate(idx, 1);
    }
  }, { passive: false });
  window.addEventListener('keyup', (e) => {
    const idx = HID_KEY_MAP[e.key];
    if (idx !== undefined && mode !== 'idle') {
      e.preventDefault();
      window.RetroInput.simulate(idx, 0);
    }
  }, { passive: false });

  // Homebrew fallback canvas
  const hbCanvas = document.getElementById('hbCanvas');
  const hbCtx = hbCanvas.getContext('2d');
  let hbAnim = null;
  let hbState = {};
  let hbKind = 'racer';
  let hbSys = 'PS1';
  let hbRewind = [];

  function stopHomebrew() {
    if (hbAnim) { cancelAnimationFrame(hbAnim); hbAnim = null; }
    hbCanvas.style.display = 'none';
  }

  function startHomebrew(title, sys, kind) {
    destroyActiveFrame(true);
    mode = 'homebrew';
    hbKind = kind || 'racer';
    hbSys = sys || 'PS1';
    hbRewind = [];
    document.getElementById('game-screen').style.display = 'none';
    hbCanvas.style.display = 'block';
    hbState = { px: 160, py: 185, vx: 0, vy: 0, score: 0, speed: 2.8, road: 0, ticks: 0 };
    notifyStatus('running', 'homebrew');
    let frames = 0, lastT = performance.now();
    function tick() {
      if (!paused) {
        for (let s = 0; s < Math.max(1, Math.round(speedMultiplier)); s++) {
          hbState.ticks++;
          if (hbState.ticks % 6 === 0) {
            hbRewind.push(Object.assign({}, hbState));
            if (hbRewind.length > 60) hbRewind.shift();
          }
          if (hbKeys.left) hbState.px = Math.max(24, hbState.px - 3);
          if (hbKeys.right) hbState.px = Math.min(296, hbState.px + 3);
          if (hbKeys.up) hbState.py = Math.max(30, hbState.py - 3);
          if (hbKeys.down) hbState.py = Math.min(215, hbState.py + 3);
          hbState.road = (hbState.road + 6) % 40;
          hbState.score += 1;
        }
      }
      const w = 320, h = 240;
      const g = hbCtx.createLinearGradient(0, 0, 0, h);
      g.addColorStop(0, '#12082E'); g.addColorStop(0.5, '#3B1D7A'); g.addColorStop(1, '#07080D');
      hbCtx.fillStyle = g; hbCtx.fillRect(0, 0, w, h);
      hbCtx.fillStyle = '#22D3EE';
      hbCtx.fillRect(hbState.px - 14, hbState.py - 10, 28, 20);
      hbCtx.fillStyle = 'rgba(7,8,13,0.7)';
      hbCtx.fillRect(8, 8, 175, 20);
      hbCtx.fillStyle = '#F8FAFC';
      hbCtx.font = 'bold 10px monospace';
      hbCtx.fillText(hbSys + ' DEMO • SCORE ' + hbState.score, 14, 21);
      frames++;
      const now = performance.now();
      if (now - lastT >= 1000) {
        const fps = Math.round(frames * 1000 / (now - lastT));
        frames = 0; lastT = now;
        if (window.RetroHost && window.RetroHost.onFpsUpdate) window.RetroHost.onFpsUpdate(fps, 16.6);
      }
      hbAnim = requestAnimationFrame(tick);
    }
    hbAnim = requestAnimationFrame(tick);
  }

  window.RetroEngine = {
    bootHomebrew: function(title, sys, kind) {
      startHomebrew(title, sys, kind);
    },

    bootEngineTest: function(cdnMode, customDataPath) {
      const romBytes = createTestGbaRomBytes();
      const blob = new Blob([romBytes], { type: 'application/octet-stream' });
      const blobUrl = URL.createObjectURL(blob);
      activeBlobUrl = blobUrl;
      window.RetroEngine.bootRom({
        title: 'RetroVerse GBA Test ROM',
        core: 'gba',
        romUrl: blobUrl,
        isAlreadyBlob: true,
        fileSizeBytes: romBytes.length,
        cdnMode: cdnMode || 'official',
        customDataPath: customDataPath || '',
        threadsMode: 'off',
        fpsCap: 60,
        frameSkip: 0,
        vsync: true,
        ffSpeed: 2,
        rewind: false,
        disableCoreShaders: true
      });
    },

    prepareOfflineBundle: async function(reqConfig) {
      finishPrepSession(false, 'Superseded');
      const core = reqConfig.core || 'gba';
      const systemId = reqConfig.systemId || core;
      const isolated = !!window.crossOriginIsolated && typeof SharedArrayBuffer !== 'undefined';
      const isPsp = (core === 'psp' || core === 'ppsspp');
      let useThreads = false;
      if (reqConfig.threadsMode === 'off') useThreads = false;
      else if (reqConfig.threadsMode === 'on') useThreads = isolated;
      else useThreads = isolated && isPsp;

      const pathtodata = await resolveCdnBaseAsync({
        cdnMode: reqConfig.cdnMode || 'official',
        customDataPath: reqConfig.customDataPath || ''
      });

      const dummyBytes = createTinyDummyRomBytes(core);
      prepBlobUrl = URL.createObjectURL(new Blob([dummyBytes], { type: 'application/octet-stream' }));
      const bootId = ++activeBootId;

      activePrepSession = {
        bootId: bootId,
        systemId: systemId,
        core: core,
        threads: useThreads,
        urls: [],
        totalBytes: 0,
        hasLoader: false,
        hasEmuJs: false,
        hasCoreData: false,
        idleTimer: null,
        timer: setTimeout(() => {
          if (activePrepSession && activePrepSession.hasLoader && activePrepSession.hasCoreData) {
            finishPrepSession(true, '');
          } else {
            finishPrepSession(false, 'Timeout preparing offline bundle for ' + core);
          }
        }, isPsp ? 55000 : 35000)
      };

      const fr = document.createElement('iframe');
      fr.style.cssText = 'position:fixed;left:-9999px;top:-9999px;width:120px;height:120px;opacity:0;pointer-events:none;border:0;';
      fr.setAttribute('allow', 'cross-origin-isolated');
      fr.srcdoc = buildIframeSrcdoc({
        bootId: bootId,
        isPrepMode: true,
        core: core,
        romUrl: prepBlobUrl,
        gameName: 'offline_prep_' + core,
        pathtodata: pathtodata,
        biosUrl: '',
        threads: useThreads,
        cheats: [],
        defaultOptions: { 'virtual-gamepad': 'disabled', 'shader': 'disabled', 'rewind-enabled': 'disabled' },
        volume: 0,
        muted: true
      });
      prepFrame = fr;
      document.body.appendChild(fr);
    },

    bootRom: async function(config) {
      stopHomebrew();
      const isFallbackRetry = !!config.__isFallbackRetry;
      if (!isFallbackRetry) {
        autoRetriedFallback = false;
        logs = [];
      }
      resetStages();
      destroyActiveFrame(!isFallbackRetry);

      activeBootId++;
      const thisBootId = activeBootId;
      mode = 'emulatorjs';
      lastConfig = config;
      paused = false;

      const gameScreen = document.getElementById('game-screen');
      gameScreen.style.display = 'block';
      gameScreen.style.flex = 'none';

      const core = config.core || 'gba';
      const isPsp = (core === 'psp' || core === 'ppsspp');
      const isHeavyCore = (core === 'psx' || core === 'pcsx_rearmed' || isPsp || core === 'n64');
      const watchdogMs = isHeavyCore ? 40000 : 25000;
      const watchdogTotalSec = Math.round(watchdogMs / 1000);

      notifyStatus('loading', core);
      notifyLoadingTick(0, watchdogTotalSec);

      const online = navigator.onLine !== false;
      const webglOk = checkWebGL2();
      const isolated = !!window.crossOriginIsolated && typeof SharedArrayBuffer !== 'undefined';

      addLog('INFO', 'Boot core=' + core + ', online=' + online + ', webgl=' + webglOk + ', isolated=' + isolated + ', size=' + (config.fileSizeBytes || 0));

      if (!webglOk) {
        addLog('ERR', '[6] WebGL/WebGL2 غير متاح.');
        setStage(6, 'fail', 'NO_WEBGL');
        notifyStatus('error', 'STAGE_6|NO_WEBGL');
        return;
      }

      let useThreads = false;
      if (config.threadsMode === 'off') useThreads = false;
      else if (config.threadsMode === 'on') useThreads = isolated;
      else useThreads = isolated && isPsp;

      if (isPsp && !isolated && config.threadsMode !== 'off') {
        addLog('ERR', 'PSP يحتاج SharedArrayBuffer وcrossOriginIsolated (Threads).');
        setStage(6, 'fail', 'PSP_NO_SAB');
        notifyStatus('error', 'PSP_NO_SAB|نواة PSP تتطلب Threads/SharedArrayBuffer. تأكد من تفعيل الترويسات الأمنية (COOP/COEP) وتحديث Android System WebView.');
        return;
      }

      await waitForNonZeroGameScreen(thisBootId);
      if (thisBootId !== activeBootId) return;

      // Avoid double RAM usage: only load into JS Blob URL if ROM <= 64MB (large PSP ISOs stream directly via HTTP 206 Range!)
      let finalRomUrl = config.romUrl;
      if (!config.isAlreadyBlob && (!config.fileSizeBytes || config.fileSizeBytes <= 64 * 1024 * 1024)) {
        try {
          addLog('INFO', 'Preparing ROM Blob URL...');
          const resp = await fetch(config.romUrl);
          if (!resp.ok) throw new Error('HTTP ' + resp.status);
          const buf = await resp.arrayBuffer();
          const blob = new Blob([buf], { type: 'application/octet-stream' });
          if (activeBlobUrl) { try { URL.revokeObjectURL(activeBlobUrl); } catch (_) {} }
          activeBlobUrl = URL.createObjectURL(blob);
          finalRomUrl = activeBlobUrl;
          addLog('INFO', 'ROM Blob ready (' + buf.byteLength + ' bytes)');
        } catch (err) {
          addLog('WARN', 'Streaming ROM directly: ' + err.message);
          finalRomUrl = config.romUrl;
        }
      } else if (!config.isAlreadyBlob) {
        addLog('INFO', 'Streaming large ROM (>64MB) via Range requests to conserve RAM.');
      }

      let finalBiosUrl = config.biosUrl || '';
      if (finalBiosUrl && finalBiosUrl.startsWith('http')) {
        try {
          const bResp = await fetch(finalBiosUrl);
          if (bResp.ok) {
            const bBuf = await bResp.arrayBuffer();
            if (activeBiosBlobUrl) { try { URL.revokeObjectURL(activeBiosBlobUrl); } catch (_) {} }
            activeBiosBlobUrl = URL.createObjectURL(new Blob([bBuf]));
            finalBiosUrl = activeBiosBlobUrl;
            addLog('INFO', 'BIOS Blob ready (' + bBuf.byteLength + ' bytes)');
          }
        } catch (err) {
          addLog('WARN', 'BIOS fetch fallback: ' + err.message);
        }
      }

      const pathtodata = await resolveCdnBaseAsync(config);
      if (thisBootId !== activeBootId) return;
      currentCdnUsed = pathtodata;
      addLog('INFO', 'DataPath=' + pathtodata + ', threads=' + useThreads);

      // Apply safe PSP default profile or user settings
      const defaultOpts = isPsp ? {
        'virtual-gamepad': 'disabled',
        'shader': 'disabled',
        'rewind-enabled': 'disabled',
        'vsync': config.vsync !== false ? 'enabled' : 'disabled',
        'frameskip': config.frameSkip > 0 ? String(config.frameSkip) : 'auto',
        'psp_internal_resolution': '1x',
        'save-state-location': 'browser'
      } : {
        'virtual-gamepad': 'disabled',
        'shader': 'disabled',
        'rewind-enabled': config.rewind ? 'enabled' : 'disabled',
        'vsync': config.vsync !== false ? 'enabled' : 'disabled',
        'ff-ratio': String(config.ffSpeed || 2) + '.0x',
        'save-state-location': 'browser'
      };
      if (!isPsp && config.frameSkip && config.frameSkip > 0) {
        defaultOpts['frameskip'] = String(config.frameSkip);
      }

      const iframe = document.createElement('iframe');
      iframe.id = 'ejs-frame';
      iframe.setAttribute('allow', 'autoplay; fullscreen; gamepad; cross-origin-isolated');
      iframe.style.position = 'absolute';
      iframe.style.inset = '0';
      iframe.style.width = '100%';
      iframe.style.height = '100%';
      iframe.style.border = '0';
      iframe.style.display = 'block';

      let elapsedSec = 0;
      countdownTimer = setInterval(() => {
        if (thisBootId !== activeBootId || frameStarted) return;
        elapsedSec++;
        notifyLoadingTick(elapsedSec, watchdogTotalSec);
      }, 1000);

      watchdogTimer = setTimeout(() => {
        if (thisBootId !== activeBootId || frameStarted) return;
        const failedStage = firstUnpassedStage();
        const reason = navigator.onLine === false ? 'OFFLINE_NOT_CACHED' : 'TIMEOUT_' + watchdogTotalSec + 'S';
        addLog('ERR', 'انتهت المهلة (' + watchdogTotalSec + 'ث) عند المرحلة [' + failedStage + '] (' + reason + ')');
        setStage(failedStage, 'fail', reason);
        tryFallbackCdnOrFail(failedStage, 'انتهت مهلة ' + watchdogTotalSec + ' ثانية عند المرحلة [' + failedStage + ']');
      }, watchdogMs);

      iframe.srcdoc = buildIframeSrcdoc({
        bootId: thisBootId,
        isPrepMode: false,
        core: core,
        romUrl: finalRomUrl,
        gameName: (config.title || 'RetroVerse').replace(/[\\/:*?"<>|]/g, '_'),
        pathtodata: pathtodata,
        biosUrl: finalBiosUrl,
        threads: useThreads,
        cheats: config.cheatsList || [],
        defaultOptions: defaultOpts,
        volume: audioVol,
        muted: audioMuted
      });

      gameScreen.innerHTML = '';
      gameScreen.appendChild(iframe);
      activeFrame = iframe;

      if (typeof ResizeObserver !== 'undefined') {
        resizeObserver = new ResizeObserver(() => {
          if (activeFrame && activeFrame.contentWindow) {
            try { activeFrame.contentWindow.dispatchEvent(new Event('resize')); } catch (_) {}
          }
        });
        resizeObserver.observe(gameScreen);
      }

      requestAnimationFrame(() => {
        if (thisBootId !== activeBootId) return;
        const cBox = measureBox(gameScreen);
        const fBox = measureBox(iframe);
        const ok = cBox.w > 100 && cBox.h > 100 && fBox.w > 100 && fBox.h > 100;
        addLog(
          ok ? 'INFO' : 'ERR',
          '[1] الحاوية #game-screen=' + cBox.w + '×' + cBox.h + ' | iframe=' + fBox.w + '×' + fBox.h
        );
        setStage(1, ok ? 'pass' : 'fail', fBox.w + '×' + fBox.h);
        if (!ok) {
          notifyStatus('error', 'STAGE_1|أبعاد الحاوية أو iframe أقل من 100px (' + fBox.w + '×' + fBox.h + ')');
        }
      });
    },

    teardown: function() {
      stopHomebrew();
      destroyActiveFrame(true);
      mode = 'idle';
    },

    getDiagnosticsLog: function() {
      return logs.join('\n');
    }
  };

  window.RetroOffline = {
    collectDiagnosticsAsync: async function() {
      let swStatus = 'not_supported';
      if ('serviceWorker' in navigator) {
        try {
          const reg = await navigator.serviceWorker.getRegistration();
          swStatus = navigator.serviceWorker.controller ? 'controlled' : (reg && reg.active ? 'active_uncontrolled' : (reg ? 'registered' : 'none'));
        } catch (e) {
          swStatus = 'error:' + e.message;
        }
      }
      let storageUsage = 0, storageQuota = 0;
      if ('storage' in navigator && typeof navigator.storage.estimate === 'function') {
        try {
          const est = await navigator.storage.estimate();
          storageUsage = est.usage || 0;
          storageQuota = est.quota || 0;
        } catch (_) {}
      }
      let cacheEntries = 0;
      try {
        if ('caches' in window) {
          const c = await caches.open(EJS_CACHE);
          const ks = await c.keys();
          cacheEntries = ks.length;
        }
      } catch (_) {}

      const result = {
        swStatus: swStatus,
        isolated: !!window.crossOriginIsolated,
        sharedArrayBuffer: typeof SharedArrayBuffer !== 'undefined',
        storageUsage: storageUsage,
        storageQuota: storageQuota,
        webCacheEntries: cacheEntries,
        webGamepadCount: webGamepadCount,
        webGamepadNames: webGamepadNames
      };
      try {
        if (window.RetroHost && window.RetroHost.onOfflineDiagnosticsResult) {
          window.RetroHost.onOfflineDiagnosticsResult(JSON.stringify(result));
        }
      } catch (_) {}
      return result;
    },
    clearWebCache: async function() {
      try {
        if ('caches' in window) await caches.delete(EJS_CACHE);
      } catch (_) {}
    }
  };

  window.RetroInput = {
    simulateForPlayer: function(player, buttonIndex, value) {
      if (mode === 'emulatorjs') {
        sendToFrame({ cmd: 'input', player: player || 0, index: buttonIndex, value: value });
      } else if (mode === 'homebrew' && (player || 0) === 0) {
        window.RetroInput.simulate(buttonIndex, value);
      }
    },
    simulate: function(buttonIndex, value) {
      if (mode === 'emulatorjs') {
        sendToFrame({ cmd: 'input', player: 0, index: buttonIndex, value: value });
      } else if (mode === 'homebrew') {
        const map = { 4: 'up', 5: 'down', 6: 'left', 7: 'right', 0: 'b', 8: 'a', 1: 'y', 9: 'x', 10: 'l1', 11: 'r1', 2: 'select', 3: 'start' };
        const k = map[buttonIndex];
        if (k) hbKeys[k] = value > 0.5;
      }
    },
    setKey: function(name, pressed) {
      const idxMap = { b: 0, y: 1, select: 2, start: 3, up: 4, down: 5, left: 6, right: 7, a: 8, x: 9, l1: 10, r1: 11, l2: 12, r2: 13, l3: 14, r3: 15 };
      if (idxMap[name] !== undefined) {
        window.RetroInput.simulate(idxMap[name], pressed ? 1 : 0);
      }
    }
  };

  window.RetroConfig = {
    setGamepadOptions: function(deadzone, haptics) {
      if (typeof deadzone === 'number') gamepadDeadzone = Math.max(0.03, Math.min(0.45, deadzone));
      gamepadHaptics = !!haptics;
    },
    applySettings: function(filter, scanlines, aspect, volume, muted, scalePercent) {
      audioVol = Math.max(0, Math.min(1, volume));
      audioMuted = !!muted;
      renderScalePercent = scalePercent || 100;
      const b = document.body;
      b.classList.remove(
        'filter-crt', 'filter-scanlines', 'filter-sharp', 'filter-lcd', 'filter-smooth',
        'scanlines-on', 'aspect-43', 'aspect-169', 'aspect-orig', 'aspect-full', 'aspect-int'
      );
      if (filter === 'CRT') b.classList.add('filter-crt');
      else if (filter === 'Scanlines') b.classList.add('filter-scanlines');
      else if (filter === 'LCD') b.classList.add('filter-lcd');
      else if (filter === 'Smooth') b.classList.add('filter-smooth');
      else b.classList.add('filter-sharp');

      if (scanlines) b.classList.add('scanlines-on');
      if (aspect === '16:9') b.classList.add('aspect-169');
      else if (aspect === 'Stretch' || aspect === 'Full') b.classList.add('aspect-full');
      else if (aspect === '4:3') b.classList.add('aspect-43');
      else if (aspect === 'Integer') b.classList.add('aspect-int');
      else b.classList.add('aspect-orig');

      if (mode === 'emulatorjs') {
        sendToFrame({ cmd: 'volume', volume: audioMuted ? 0 : audioVol });
      }
    },
    setSpeed: function(mult) {
      speedMultiplier = mult || 1;
      if (mode === 'emulatorjs') sendToFrame({ cmd: 'speed', mult: speedMultiplier });
    },
    togglePause: function() {
      paused = !paused;
      if (mode === 'emulatorjs') sendToFrame({ cmd: 'pause', paused: paused });
      return paused;
    },
    resetGame: function() {
      if (mode === 'emulatorjs') sendToFrame({ cmd: 'restart' });
      else if (lastConfig) startHomebrew('RetroVerse', hbSys, hbKind);
    },
    rewindStep: function() {
      if (mode === 'emulatorjs') {
        sendToFrame({ cmd: 'rewind' });
      } else if (hbRewind.length > 0) {
        const snap = hbRewind.pop();
        if (snap) hbState = snap;
      }
    },
    applyCheats: function(cheatsList) {
      if (mode === 'emulatorjs') sendToFrame({ cmd: 'set_cheats', cheats: cheatsList });
    },
    setDisc: function(discIndex) {
      if (mode === 'emulatorjs') sendToFrame({ cmd: 'disc', discIndex: discIndex });
    },
    exportStateAsync: function(cbName) {
      if (mode === 'homebrew') {
        const data = JSON.stringify({ hb: hbState });
        window.RetroHost && window.RetroHost.onStateExported && window.RetroHost.onStateExported(cbName, data);
        return;
      }
      const reqId = 'st_' + (reqSeq++);
      pendingCallbacks[reqId] = function(data) {
        window.RetroHost && window.RetroHost.onStateExported && window.RetroHost.onStateExported(cbName, data || '');
      };
      sendToFrame({ cmd: 'export_state', reqId: reqId });
    },
    importState: function(jsonStr) {
      if (mode === 'emulatorjs') {
        sendToFrame({ cmd: 'import_state', jsonStr: jsonStr });
      } else {
        try {
          const p = JSON.parse(jsonStr);
          if (p && p.hb) hbState = p.hb;
        } catch (_) {}
      }
    },
    captureScreenshotAsync: function(cbName) {
      if (mode === 'homebrew') {
        const dataUrl = hbCanvas.toDataURL('image/png');
        window.RetroHost && window.RetroHost.onScreenshotCaptured && window.RetroHost.onScreenshotCaptured(cbName, dataUrl);
        return;
      }
      const reqId = 'sc_' + (reqSeq++);
      pendingCallbacks[reqId] = function(dataUrl) {
        window.RetroHost && window.RetroHost.onScreenshotCaptured && window.RetroHost.onScreenshotCaptured(cbName, dataUrl || '');
      };
      sendToFrame({ cmd: 'screenshot', reqId: reqId });
    }
  };
})();
</script>
</body>
