<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>RetroVerse Core</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
  html, body {
    width: 100%; height: 100%;
    background: #05060B;
    overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    font-family: system-ui, -apple-system, sans-serif;
  }
  #stage {
    position: relative;
    width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
    background: #05060B;
  }
  #game {
    width: 100% !important;
    height: 100% !important;
    min-height: 240px;
    display: flex !important;
    align-items: center;
    justify-content: center;
  }
  #game canvas, .ejs_canvas, canvas {
    width: 100% !important;
    height: 100% !important;
    max-width: 100% !important;
    max-height: 100% !important;
    object-fit: contain;
    display: block !important;
  }
  #hbCanvas {
    width: 100% !important;
    height: 100% !important;
    object-fit: contain;
    image-rendering: pixelated;
    background: #07080D;
    display: block !important;
  }
  .ejs_virtualGamepad_parent, .ejs_menu_bar { display: none !important; }

  #scanlines-overlay {
    pointer-events: none;
    position: absolute; inset: 0;
    background: repeating-linear-gradient(
      to bottom,
      rgba(0,0,0,0) 0px,
      rgba(0,0,0,0) 2px,
      rgba(0,0,0,0.34) 3px,
      rgba(0,0,0,0.34) 4px
    );
    opacity: 0;
    z-index: 20;
    transition: opacity 0.2s ease;
  }
  #crt-overlay {
    pointer-events: none;
    position: absolute; inset: 0;
    background: radial-gradient(circle at center, transparent 58%, rgba(0,0,0,0.62) 100%);
    box-shadow: inset 0 0 36px rgba(139, 92, 246, 0.16);
    opacity: 0;
    z-index: 21;
    transition: opacity 0.2s ease;
  }
  .filter-crt #scanlines-overlay { opacity: 0.72; }
  .filter-crt #crt-overlay { opacity: 1; }
  .filter-scanlines #scanlines-overlay { opacity: 0.90; }
  .filter-lcd #scanlines-overlay {
    opacity: 0.42;
    background: repeating-linear-gradient(90deg, rgba(255,255,255,0.04) 0 1px, transparent 1px 3px),
                repeating-linear-gradient(0deg, rgba(0,0,0,0.22) 0 1px, transparent 1px 3px);
  }
  .scanlines-on #scanlines-overlay { opacity: 0.85; }
  .aspect-43 #hbCanvas, .aspect-43 #game { max-width: calc(100vh * 4 / 3); aspect-ratio: 4 / 3; }
  .aspect-169 #hbCanvas, .aspect-169 #game { width: 100%; height: 100%; max-width: 100%; }
  .aspect-full #hbCanvas, .aspect-full #game { width: 100%; height: 100%; max-width: 100%; }
  .aspect-full #hbCanvas, .aspect-full #game canvas { object-fit: fill !important; }
</style>
</head>
<body class="filter-crt aspect-43">
  <div id="stage">
    <div id="game"></div>
    <canvas id="hbCanvas" width="320" height="240" style="display:none;"></canvas>
    <div id="scanlines-overlay"></div>
    <div id="crt-overlay"></div>
  </div>

<script>
(function() {
  const keys = {
    up: false, down: false, left: false, right: false,
    a: false, b: false, x: false, y: false,
    l1: false, r1: false, start: false, select: false
  };

  const EJS_BTN = {
    b: 0, y: 1, select: 2, start: 3,
    up: 4, down: 5, left: 6, right: 7,
    a: 8, x: 9, l1: 10, r1: 11
  };
  const KEY_MAP = {
    up: { code: 'ArrowUp', key: 'ArrowUp', keyCode: 38 },
    down: { code: 'ArrowDown', key: 'ArrowDown', keyCode: 40 },
    left: { code: 'ArrowLeft', key: 'ArrowLeft', keyCode: 37 },
    right: { code: 'ArrowRight', key: 'ArrowRight', keyCode: 39 },
    a: { code: 'KeyZ', key: 'z', keyCode: 90 },
    b: { code: 'KeyX', key: 'x', keyCode: 88 },
    x: { code: 'KeyA', key: 'a', keyCode: 65 },
    y: { code: 'KeyS', key: 's', keyCode: 83 },
    l1: { code: 'KeyQ', key: 'q', keyCode: 81 },
    r1: { code: 'KeyW', key: 'w', keyCode: 87 },
    start: { code: 'Enter', key: 'Enter', keyCode: 13 },
    select: { code: 'ShiftRight', key: 'Shift', keyCode: 16 }
  };

  let mode = 'homebrew';
  let cartridgeMode = 'racer';
  let gameTitle = 'Crash Racer';
  let systemName = 'PS1';
  let speedMultiplier = 1;
  let audioVol = 0.75;
  let paused = false;
  let audioCtx = null;

  function notifyStatus(status, detail) {
    try {
      if (window.RetroHost && window.RetroHost.onEngineStatus) {
        window.RetroHost.onEngineStatus(status, detail || '');
      }
    } catch (_) {}
  }

  function beep(freq, dur, type) {
    if (audioVol <= 0.02) return;
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type || 'square';
      osc.frequency.value = freq;
      gain.gain.value = audioVol * 0.08;
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(); osc.stop(audioCtx.currentTime + dur);
    } catch (_) {}
  }

  window.RetroInput = {
    setKey: function(name, pressed) {
      const prev = keys[name];
      keys[name] = !!pressed;
      if (pressed && !prev && mode === 'homebrew') {
        if (name === 'a' || name === 'b') beep(520, 0.07, 'square');
        else if (name === 'x' || name === 'y') beep(680, 0.06, 'triangle');
      }
      if (mode === 'emulatorjs' && window.EJS_emulator && window.EJS_emulator.gameManager) {
        try {
          const idx = EJS_BTN[name];
          if (idx !== undefined) {
            window.EJS_emulator.gameManager.simulateInput(0, idx, pressed ? 1 : 0);
          }
        } catch (_) {}
      }
      const km = KEY_MAP[name];
      if (km) {
        try {
          const evtInit = {
            code: km.code, key: km.key, keyCode: km.keyCode, which: km.keyCode,
            bubbles: true, cancelable: true
          };
          const evtType = pressed ? 'keydown' : 'keyup';
          document.dispatchEvent(new KeyboardEvent(evtType, evtInit));
          window.dispatchEvent(new KeyboardEvent(evtType, evtInit));
          const canvas = document.querySelector('#game canvas');
          if (canvas) canvas.dispatchEvent(new KeyboardEvent(evtType, evtInit));
        } catch (_) {}
      }
    }
  };

  window.RetroConfig = {
    applySettings: function(filter, scanlines, aspect, volume) {
      audioVol = Math.max(0, Math.min(1, volume));
      const b = document.body;
      b.classList.remove(
        'filter-crt', 'filter-scanlines', 'filter-sharp', 'filter-lcd',
        'scanlines-on', 'aspect-43', 'aspect-169', 'aspect-orig', 'aspect-full'
      );
      if (filter === 'CRT') b.classList.add('filter-crt');
      else if (filter === 'Scanlines') b.classList.add('filter-scanlines');
      else if (filter === 'LCD') b.classList.add('filter-lcd');
      else b.classList.add('filter-sharp');
      if (scanlines) b.classList.add('scanlines-on');
      if (aspect === '16:9') b.classList.add('aspect-169');
      else if (aspect === 'Full') b.classList.add('aspect-full');
      else if (aspect === 'Original') b.classList.add('aspect-orig');
      else b.classList.add('aspect-43');

      if (mode === 'emulatorjs' && window.EJS_emulator) {
        try {
          if (typeof window.EJS_emulator.setVolume === 'function') {
            window.EJS_emulator.setVolume(audioVol);
          }
        } catch (_) {}
      }
    },
    setSpeed: function(mult) {
      speedMultiplier = mult || 1;
      if (mode === 'emulatorjs' && window.EJS_emulator && window.EJS_emulator.gameManager) {
        try {
          window.EJS_emulator.gameManager.toggleFastForward(mult > 1 ? 1 : 0);
        } catch (_) {}
      }
    },
    togglePause: function() {
      paused = !paused;
      if (mode === 'emulatorjs' && window.EJS_emulator) {
        try {
          if (paused && window.EJS_emulator.pause) window.EJS_emulator.pause(true);
          else if (!paused && window.EJS_emulator.play) window.EJS_emulator.play();
        } catch (_) {}
      }
      return paused;
    },
    resetGame: function() {
      if (mode === 'emulatorjs' && window.EJS_emulator && window.EJS_emulator.gameManager) {
        try { window.EJS_emulator.gameManager.restart(); return true; } catch (_) {}
      } else {
        initHomebrew(gameTitle, systemName, cartridgeMode);
        return true;
      }
      return false;
    },
    rewindStep: function() {
      if (mode === 'emulatorjs' && window.EJS_emulator && window.EJS_emulator.gameManager) {
        try {
          if (typeof window.EJS_emulator.gameManager.rewind === 'function') {
            window.EJS_emulator.gameManager.rewind();
            return true;
          }
        } catch (_) {}
      }
      if (mode === 'homebrew' && rewindBuffer.length > 5) {
        const snap = rewindBuffer.splice(-12, 12)[0];
        if (snap) {
          state = JSON.parse(JSON.stringify(snap));
          beep(320, 0.08, 'sawtooth');
        }
        return true;
      }
      return false;
    },
    exportState: function() {
      if (mode === 'homebrew') {
        return JSON.stringify({ cartridgeMode, state });
      }
      if (window.EJS_emulator && window.EJS_emulator.gameManager) {
        try {
          const bytes = window.EJS_emulator.gameManager.getState();
          if (bytes) {
            let bin = '';
            const chunk = 8192;
            for (let i = 0; i < bytes.length; i += chunk) {
              bin += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));
            }
            return JSON.stringify({ ejs: btoa(bin) });
          }
        } catch (_) {}
      }
      return JSON.stringify({ cartridgeMode, state });
    },
    importState: function(jsonStr) {
      try {
        const parsed = JSON.parse(jsonStr);
        if (parsed.ejs && mode === 'emulatorjs' && window.EJS_emulator && window.EJS_emulator.gameManager) {
          const bin = atob(parsed.ejs);
          const arr = new Uint8Array(bin.length);
          for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
          window.EJS_emulator.gameManager.loadState(arr);
          return true;
        }
        if (parsed.state) {
          state = parsed.state;
          beep(740, 0.09, 'triangle');
          return true;
        }
      } catch (_) {}
      return false;
    },
    captureScreenshot: function() {
      try {
        if (mode === 'homebrew') {
          return hbCanvas.toDataURL('image/png');
        }
        const ejsCanvas = document.querySelector('#game canvas');
        if (ejsCanvas) return ejsCanvas.toDataURL('image/png');
      } catch (_) {}
      return hbCanvas.toDataURL('image/png');
    }
  };

  const hbCanvas = document.getElementById('hbCanvas');
  const ctx = hbCanvas.getContext('2d');
  let rewindBuffer = [];
  let state = {};
  let frameCount = 0;
  let lastFpsTime = performance.now();
  let animId = null;

  function initHomebrew(title, sys, kind) {
    mode = 'homebrew';
    gameTitle = title || 'RetroVerse';
    systemName = sys || 'PS1';
    cartridgeMode = kind || 'racer';
    document.getElementById('game').style.display = 'none';
    hbCanvas.style.display = 'block';
    rewindBuffer = [];

    state = {
      px: 160, py: 185, vx: 0, vy: 0,
      score: 0, speed: 2.8, roadOffset: 0,
      ticks: 0, stars: Array.from({length: 34}, (_, i) => ({
        x: (i * 47) % 320, y: (i * 29) % 130, r: (i % 2) + 1
      })),
      obstacles: [
        { x: 110, y: 120, lane: -0.4, w: 22 },
        { x: 210, y: 80, lane: 0.45, w: 22 }
      ],
      bullets: [],
      platforms: [
        { x: 20, y: 195, w: 95 },
        { x: 135, y: 162, w: 80 },
        { x: 230, y: 130, w: 75 },
        { x: 0, y: 224, w: 320 }
      ],
      coins: [
        { x: 165, y: 142, taken: false },
        { x: 260, y: 110, taken: false },
        { x: 65, y: 175, taken: false }
      ],
      grounded: false
    };

    notifyStatus('running', '');
    if (!animId) loop();
  }

  function stepHomebrew() {
    if (paused) return;
    state.ticks++;
    if (state.ticks % 4 === 0) {
      rewindBuffer.push(JSON.parse(JSON.stringify(state)));
      if (rewindBuffer.length > 90) rewindBuffer.shift();
    }

    if (cartridgeMode === 'racer' || cartridgeMode === 'kart') {
      if (keys.left) state.px -= 3.2;
      if (keys.right) state.px += 3.2;
      if (keys.a || keys.up) state.speed = Math.min(7.5, state.speed + 0.12);
      else if (keys.b || keys.down) state.speed = Math.max(1.2, state.speed - 0.18);
      else state.speed = Math.max(2.6, state.speed - 0.03);
      state.px = Math.max(68, Math.min(252, state.px));
      state.roadOffset = (state.roadOffset + state.speed * 2.5) % 40;
      state.score += Math.floor(state.speed);
      state.obstacles.forEach((ob, idx) => {
        ob.y += state.speed * 1.1;
        if (ob.y > 240) {
          ob.y = 112;
          ob.lane = ((state.ticks + idx * 37) % 100 - 50) / 65;
        }
      });
    } else if (cartridgeMode === 'pilot' || cartridgeMode === 'space' || cartridgeMode === 'ring') {
      if (keys.left) state.px -= 3.0;
      if (keys.right) state.px += 3.0;
      if (keys.up) state.py -= 2.8;
      if (keys.down) state.py += 2.8;
      state.px = Math.max(20, Math.min(300, state.px));
      state.py = Math.max(28, Math.min(214, state.py));
      if ((keys.a || keys.x) && state.ticks % 8 === 0) {
        state.bullets.push({ x: state.px + 10, y: state.py });
        beep(840, 0.04, 'square');
      }
      state.bullets = state.bullets.filter(b => {
        b.x += 6.5;
        return b.x < 330;
      });
      state.obstacles.forEach((ob, idx) => {
        ob.x -= 2.3;
        if (ob.x < -20) {
          ob.x = 330;
          ob.y = 35 + ((state.ticks * (idx + 3)) % 175);
        }
        state.bullets.forEach(b => {
          if (Math.abs(b.x - ob.x) < 16 && Math.abs(b.y - ob.y) < 16) {
            ob.x = 340; state.score += 100; beep(240, 0.09, 'sawtooth');
          }
        });
      });
      state.stars.forEach(s => { s.x -= 1.2; if (s.x < 0) s.x = 320; });
    } else {
      if (keys.left) state.vx = -2.8;
      else if (keys.right) state.vx = 2.8;
      else state.vx *= 0.72;
      if ((keys.a || keys.up) && state.grounded) {
        state.vy = -6.4; state.grounded = false; beep(620, 0.08, 'square');
      }
      state.vy = Math.min(6.0, state.vy + 0.34);
      state.px = Math.max(12, Math.min(308, state.px + state.vx));
      state.py += state.vy;
      state.grounded = false;
      state.platforms.forEach(p => {
        if (state.vy >= 0 && state.px >= p.x - 8 && state.px <= p.x + p.w + 8 &&
            state.py >= p.y - 12 && state.py <= p.y + 8) {
          state.py = p.y - 12; state.vy = 0; state.grounded = true;
        }
      });
      state.coins.forEach(c => {
        if (!c.taken && Math.hypot(state.px - c.x, state.py - c.y) < 16) {
          c.taken = true; state.score += 250; beep(980, 0.1, 'triangle');
        }
      });
      if (state.coins.every(c => c.taken)) {
        state.coins.forEach(c => c.taken = false);
      }
    }
  }

  function renderHomebrew() {
    const w = 320, h = 240;
    ctx.clearRect(0, 0, w, h);
    if (cartridgeMode === 'racer' || cartridgeMode === 'kart') {
      const sky = ctx.createLinearGradient(0, 0, 0, 118);
      sky.addColorStop(0, '#12082E'); sky.addColorStop(0.55, '#8B5CF6'); sky.addColorStop(1, '#F59E0B');
      ctx.fillStyle = sky; ctx.fillRect(0, 0, w, 118);

      const sunGrad = ctx.createLinearGradient(0, 34, 0, 108);
      sunGrad.addColorStop(0, '#FDE047'); sunGrad.addColorStop(1, '#EC4899');
      ctx.fillStyle = sunGrad; ctx.beginPath(); ctx.arc(160, 74, 34, 0, Math.PI * 2); ctx.fill();

      ctx.fillStyle = '#0B0D18'; ctx.fillRect(0, 118, w, 122);
      ctx.fillStyle = '#181B2C';
      ctx.beginPath();
      ctx.moveTo(132, 118); ctx.lineTo(188, 118);
      ctx.lineTo(305, 240); ctx.lineTo(15, 240);
      ctx.closePath(); ctx.fill();

      ctx.strokeStyle = '#22D3EE'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(132, 118); ctx.lineTo(15, 240); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(188, 118); ctx.lineTo(305, 240); ctx.stroke();

      ctx.fillStyle = '#8B5CF6';
      for (let i = 0; i < 6; i++) {
        const y = 122 + ((i * 22 + state.roadOffset) % 118);
        const t = (y - 118) / 122;
        ctx.fillRect(160 - 2 * t, y, 4 * t + 1, 8 * t + 2);
      }

      state.obstacles.forEach(ob => {
        const t = Math.max(0.05, (ob.y - 114) / 126);
        const ox = 160 + ob.lane * 110 * t;
        const ow = 26 * t, oh = 16 * t;
        ctx.fillStyle = '#EC4899'; ctx.fillRect(ox - ow / 2, ob.y - oh, ow, oh);
      });

      ctx.fillStyle = '#22D3EE'; ctx.fillRect(state.px - 20, 198, 40, 20);
      ctx.fillStyle = '#8B5CF6'; ctx.fillRect(state.px - 14, 190, 28, 10);
    } else {
      const bg = ctx.createLinearGradient(0, 0, 0, h);
      bg.addColorStop(0, '#050814'); bg.addColorStop(1, '#0E2438');
      ctx.fillStyle = bg; ctx.fillRect(0, 0, w, h);
      ctx.fillStyle = '#8B5CF6'; ctx.fillRect(state.px - 9, state.py - 12, 18, 22);
    }

    ctx.fillStyle = 'rgba(7,8,13,0.62)';
    ctx.fillRect(8, 8, 130, 18);
    ctx.fillStyle = '#E2E8F0';
    ctx.font = 'bold 10px monospace';
    ctx.fillText(systemName + ' • SCORE ' + state.score, 14, 20);
  }

  function loop() {
    for (let i = 0; i < speedMultiplier; i++) stepHomebrew();
    renderHomebrew();
    frameCount++;
    const now = performance.now();
    if (now - lastFpsTime >= 1000) {
      const fps = Math.round((frameCount * 1000) / (now - lastFpsTime));
      frameCount = 0; lastFpsTime = now;
      if (window.RetroHost && window.RetroHost.onFpsUpdate) window.RetroHost.onFpsUpdate(fps);
    }
    animId = requestAnimationFrame(loop);
  }

  window.RetroEngine = {
    bootHomebrew: function(title, sys, kind) {
      initHomebrew(title, sys, kind);
    },
    bootRom: function(config) {
      if (animId) { cancelAnimationFrame(animId); animId = null; }
      mode = 'emulatorjs';
      gameTitle = config.title || 'RetroVerse';
      systemName = config.core ? config.core.toUpperCase() : 'GAME';
      hbCanvas.style.display = 'none';
      const gameDiv = document.getElementById('game');
      gameDiv.style.display = 'flex';
      gameDiv.innerHTML = '';

      notifyStatus('loading', config.core || 'auto');

      const core = config.core || 'nes';
      const isPsp = (core === 'psp' || core === 'ppsspp');
      const isIsolated = !!window.crossOriginIsolated;

      if (isPsp && !isIsolated) {
        notifyStatus('error', 'PSP_NO_SAB');
        return;
      }

      window.EJS_player = '#game';
      window.EJS_core = core;
      window.EJS_gameUrl = config.romUrl;
      window.EJS_gameName = gameTitle;
      window.EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
      window.EJS_startOnLoaded = true;
      window.EJS_threads = isPsp; // إجبار التفعيل لـ PSP فقط، وتعطيلها لـ GBA/PS1 لتجنب تعطلها
      window.EJS_color = '#8B5CF6';
      window.EJS_VirtualGamepadSettings = [];

      if (config.biosUrl && config.biosUrl.length > 0) {
        window.EJS_biosUrl = config.biosUrl;
      }
      if (config.cheats) {
        window.EJS_cheats = [[0, config.cheats]];
      }
      window.EJS_defaultOptions = {
        'shader': config.shader || 'disabled',
        'rewind-enabled': config.rewind ? 'enabled' : 'disabled',
        'vsync': config.vsync ? 'enabled' : 'disabled',
        'ff-ratio': String(config.ffSpeed || 2) + '.0x',
        'save-state-location': 'browser'
      };

      let loadTimer = setTimeout(() => {
        notifyStatus('error', 'TIMEOUT');
      }, 15000);

      window.EJS_onGameStart = function() {
        clearTimeout(loadTimer);
        notifyStatus('running', core);
        try {
          if (window.EJS_emulator && typeof window.EJS_emulator.setVolume === 'function') {
            window.EJS_emulator.setVolume(audioVol);
          }
        } catch (_) {}

        // حل مشكلة GBA الشاشة السوداء: فرض إعادة تحجيم وعرض الـ Canvas بعد البدء
        setTimeout(() => {
          try {
            window.dispatchEvent(new Event('resize'));
            const c = document.querySelector('#game canvas');
            if (c) {
              c.style.width = '100%';
              c.style.height = '100%';
              c.style.display = 'block';
            }
          } catch (_) {}
        }, 400);

        if (window.RetroHost && window.RetroHost.onFpsUpdate) {
          window.RetroHost.onFpsUpdate(60);
        }
      };

      const old = document.getElementById('ejs-loader-script');
      if (old) old.remove();
      const script = document.createElement('script');
      script.id = 'ejs-loader-script';
      script.src = 'https://cdn.emulatorjs.org/stable/data/loader.js';
      script.onerror = function() {
        clearTimeout(loadTimer);
        notifyStatus('error', 'CDN_LOAD_FAILED');
      };
      document.body.appendChild(script);
    }
  };
})();
</script>
</body>
</html>
